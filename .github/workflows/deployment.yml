name: Deploy to GitHub Pages

# Runs automatically on every push to master, and can also be triggered
# manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; if a new push comes in while one is
# running, let the current one finish rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Assumes index.html, styles.css, and app.js live at the repo root.
          # If they're in a subfolder instead (e.g. "site/"), change this to that path.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
